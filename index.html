<style>
:root{--ink:#2f2a28;--mute:#7a716c;--line:#d8e2dd;--bg:#f3f7f5;--card:#fff;--wine:#2e8b6a;--ok:#2f8f5b;--ng:#c0392b;--warn:#b7791f}
*{box-sizing:border-box}body{margin:0;overflow-x:hidden;font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:3px solid var(--wine);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0;color:var(--wine)}
select,input,button{font:inherit}button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}button:hover{background:#f3ece5}
.tabs button{border-radius:6px 6px 0 0;border-bottom:none}.tabs button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
main{padding:12px 14px 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.grid{border-collapse:collapse;font-size:12px}.grid th,.grid td{border:1px solid var(--line);padding:0;text-align:center;min-width:34px;height:28px}
.grid th{background:#f4ede6;font-weight:600}.grid td.nm,.grid th.nm{min-width:170px;text-align:left;padding:0 6px;position:sticky;left:0;background:#fff;z-index:2}
.grid th.nm{background:#f4ede6}.grid td.role{min-width:210px;text-align:left;padding:0 4px;font-size:11px;color:var(--mute)}
.closed{background:#efeae5!important}.sat{color:#2a6fb0}.sun,.hol{color:var(--ng)}
.cell{cursor:pointer;user-select:none;font-size:11px;line-height:28px;height:28px}
.s-出勤{background:#cdeedb}.s-9-16,.s-9-17,.s-9-18{background:#e4f6ec}.s-休み{background:#eee;color:#999}.s-欠勤{background:#f7c9c4}.s-有給{background:#cfe3f7}.s-遅刻,.s-早退{background:#fbe8b8}
.u-欠席{background:#f3d2d2;color:#a33}.u-通所{background:#fbd9b5}.u-在宅{background:#cfe3f7}
.ng{background:#fde2df;color:var(--ng);font-weight:700}.okc{color:var(--ok)}
.sum td,.sum th{background:#fbf8f4;font-size:11px}
.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px #0003;padding:4px;display:none}
.pop button{display:block;width:120px;text-align:left;border:none;border-radius:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi b{font-size:22px;display:block}.kpi small{color:var(--mute)}
.kpi.bad{border-color:var(--ng);background:#fff6f5}.kpi.good{border-color:var(--ok)}
table.t{border-collapse:collapse;width:100%}table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:right}table.t th{background:#f4ede6}table.t td:first-child,table.t th:first-child{text-align:left}
.warn{color:var(--warn)}.note{color:var(--mute);font-size:12px}
input.i{width:110px;padding:3px 6px;border:1px solid var(--line);border-radius:5px}input.n{width:100%;border:none;padding:4px 6px;font-size:12px;background:transparent}
.scroll{overflow-x:auto;max-width:100%}.right{text-align:right}
label.f{display:inline-flex;flex-direction:column;font-size:12px;color:var(--mute);margin:0 14px 10px 0}label.f input,label.f select{margin-top:2px;color:var(--ink)}
.banner{border-radius:12px;padding:14px 18px;margin-bottom:12px;border:2px solid}.banner.bad{background:#fff3f1;border-color:#e8a39a}.banner.good{background:#effaf3;border-color:#9fd5b5}
.bn{font-size:22px;font-weight:700}.banner.bad .bn{color:var(--ng)}.banner.good .bn{color:var(--ok)}.bs{margin-top:4px;color:var(--ink)}
.legend{margin-bottom:8px;font-size:12px}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}.dot.g{background:#cdeedb}.dot.r{background:#f7c9c4}.dot.x{background:#e6e0da}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.ch{text-align:center;font-weight:700;padding:4px}.ch.sun{color:var(--ng)}.ch.sat{color:#2a6fb0}
.cd{min-height:104px;border-radius:10px;padding:6px 8px;border:1px solid var(--line);background:#fff}.cd.empty{border:none;background:none}
.cd.okd{background:#eefaf2;border-color:#b7e2c8;cursor:pointer}.cd.ngd{background:#fdeceb;border-color:#eaa9a0;cursor:pointer}.cd.closedc{background:#efeae5;color:#aaa}
.dn{font-weight:700;font-size:15px}.dn.sun{color:var(--ng)}.dn.sat{color:#2a6fb0}.dn small{font-weight:400}.cl{text-align:center;margin-top:18px;color:#b0a8a0}
.big{text-align:center;font-size:20px;font-weight:700;margin:4px 0}.okd .big{color:var(--ok);font-size:26px}.ngd .big{color:var(--ng);font-size:17px;line-height:1.25}
.mini{font-size:11px;color:var(--mute);text-align:center}details summary{cursor:pointer}
.cat td,.cat th{text-align:left!important}.cat td:first-child{text-align:center!important}.lg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(#e6f3ed,#f3f7f5)}
.lgc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 34px;width:min(92vw,380px);box-shadow:0 8px 30px #2e8b6a22}
.lgc h2{margin:0 0 4px;color:var(--wine);font-size:22px}.lgc p{margin:0 0 18px;color:var(--mute);font-size:13px}
.lgc label{display:block;font-size:12px;color:var(--mute);margin-top:12px}.lgc input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-top:4px}
.lgc button{width:100%;margin-top:20px;background:var(--wine);color:#fff;border:none;padding:12px;font-size:15px;border-radius:8px}.lgc .er{color:var(--ng);font-size:12px;min-height:16px;margin-top:8px}

// ---------- 月の自動切り替え・保管・先の月の作成 ----------
function jpHolidays(y,m){const H=new Set();const add=(mm,dd)=>{if(mm===m)H.add(dd)};
 [[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].forEach(a=>add(a[0],a[1]));
 const nth=(mm,n)=>{let c=0;for(let d=1;d<=31;d++){const dt=new Date(y,mm-1,d);if(dt.getMonth()!==mm-1)break;if(dt.getDay()===1&&++c===n)return d}};
 add(1,nth(1,2));add(7,nth(7,3));add(9,nth(9,3));add(10,nth(10,2));
 add(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)));add(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)));
 // 振替休日（日曜の祝日の次の平日）
 [...H].forEach(d=>{if(new Date(y,m-1,d).getDay()===0){let n=d+1;while(H.has(n))n++;H.add(n)}});
 return [...H].filter(x=>x&&new Date(y,m-1,x).getMonth()===m-1).sort((a,b)=>a-b)}
function newMonth(y,m,prev){const days=new Date(y,m,0).getDate();const hol=jpHolidays(y,m);const closed=[];
 for(let d=1;d<=days;d++){const w=new Date(y,m-1,d).getDay();const off=w===0||w===6||(m===12&&d>=29)||(m===1&&d<=3)||(m===8&&d>=13&&d<=16);if(off)closed.push(d)}
 return{y,m,holiday:hol,closed,staff:[],users:[]}}
function ensureMonth(y,m){let i=S.months.findIndex(x=>x.y===y&&x.m===m);if(i>=0)return i;
 const key=y*12+m;let at=S.months.length;for(let k=0;k<S.months.length;k++)if(S.months[k].y*12+S.months[k].m>key){at=k;break}

  const tgt=kind==='s'?p.d:(field==='r'?p.r:p.u);if(val)tgt[dd]=val;else delete tgt[dd]})}

  mo.users.forEach(p=>{let r=S.roster.users.find(x=>x.name===p.name);if(!r){r={name:p.name,group:p.group||'',start:p.start||'',from:S.months.indexOf(mo)===0?'':monthFirst(mo),to:'',pat:{},rpat:{}};S.roster.users.push(r)}

   for(let d=1;d<=days;d++){const v=(d in p.ex)?p.ex[d]:expS(r,mo,d);if(v)p.d[d]=v;else delete p.d[d]}st.push(p)});mo.staff=st;
  const us=[];S.roster.users.forEach(r=>{if(!rActive(r,mo))return;let p=mo.users.find(x=>x.name===r.name)||{u:{},r:{},ex:{},exr:{}};p.name=r.name;p.group=r.group||'';p.start=r.start||'';p.ex=p.ex||{};p.exr=p.exr||{};
   for(let d=1;d<=days;d++){const v=(d in p.ex)?p.ex[d]:expU(r,mo,d);if(v)p.u[d]=v;else delete p.u[d];const rv=(d in p.exr)?p.exr[d]:expR(r,mo,d);if(rv)p.r[d]=rv;else delete p.r[d]}us.push(p)});mo.users=us})}

 const R={staff:[],users:[]};const mi=S.months;const last=mi.length-1;
 const seen={staff:{},users:{}};
 mi.forEach((mo,i)=>{['staff','users'].forEach(k=>mo[k].forEach(p=>{const o=seen[k][p.name]||(seen[k][p.name]={first:i,last:i,p});o.last=i;o.p=p}))});
 const mode=(vals,total,th)=>{const c={};vals.forEach(v=>c[v]=(c[v]||0)+1);let best='',n=0;for(const k in c)if(c[k]>n){best=k;n=c[k]}return(best&&n/Math.max(total,1)>=th)?best:''};
 const infer=(kind,name,f,l)=>{const pat={},rpat={};for(let w=0;w<7;w++){const vals=[],rv=[];let tot=0,tt=0;
   for(let i=f;i<=l;i++){const mo=mi[i];const p=mo[kind].find(x=>x.name===name);if(!p)continue;for(let d=1;d<=new Date(mo.y,mo.m,0).getDate();d++){if(mo.closed.includes(d)||new Date(mo.y,mo.m-1,d).getDay()!==w)continue;
     const v=kind==='staff'?(p.d[d]||''):(p.u[d]||'');vals.push(v);tot++;if(kind==='users'&&v==='通所'){rv.push(p.r[d]||'');tt++}}}
   const m1=mode(vals,tot,0.6);if(m1&&((kind==='staff'&&m1.startsWith('出勤'))||(kind==='users'&&(m1==='通所'||m1==='在宅'))))pat[w]=m1;if(kind==='users'&&pat[w]==='通所'){const m2=mode(rv,tt,0.6);if(m2)rpat[w]=m2}}
  return{pat,rpat}};
 for(const nm in seen.staff){const o=seen.staff[nm],p=o.p,inf=infer('staff',nm,o.first,o.last);let pat=inf.pat;
  if(!Object.keys(pat).length&&!mi.some(mo=>{const q=mo.staff.find(x=>x.name===nm);return q&&Object.keys(q.d).length})){const v=(p.role||'').includes('9-18')?'出勤(9-18)':(p.role||'').includes('9-17')?'出勤(9-17)':(p.role||'').includes('9-16')?'出勤(9-16)':'出勤';[1,2,3,4,5].forEach(w=>pat[w]=v)}
  R.staff.push({name:nm,role:p.role||'',h:p.h??null,from:o.first===0?'':monthFirst(mi[o.first]),to:o.last===last?'':iso(mi[o.last].y,mi[o.last].m,new Date(mi[o.last].y,mi[o.last].m,0).getDate()),pat})}
 for(const nm in seen.users){const o=seen.users[nm],p=o.p,inf=infer('users',nm,o.first,o.last);
  R.users.push({name:nm,group:p.group||'',start:p.start||'',from:o.first===0?'':monthFirst(mi[o.first]),to:o.last===last?'':iso(mi[o.last].y,mi[o.last].m,new Date(mi[o.last].y,mi[o.last].m,0).getDate()),pat:inf.pat,rpat:inf.rpat})}

const dim=mo=>new Date(mo.y,mo.m,0).getDate();

function defH(p){const r=p.role||'';if(p.h)return p.h;if(r.includes('9-18'))return 8;return S.settings.h916}
function hrs(st,p){if(!st)return 0;if(st==='出勤'||st==='遅刻'||st==='早退')return defH(p);
 if(st==='出勤(9-16)')return 6;if(st==='出勤(9-17)')return 7;if(st==='出勤(9-18)')return 8;return 0}
const present=st=>st==='出勤'||st==='遅刻'||st==='早退'||(st||'').startsWith('出勤(');
const f1=x=>Math.round(x*10)/10, f2=x=>Math.round(x*100)/100, yen=x=>'¥'+Math.round(x).toLocaleString();
function dayStats(mo,d){
 const s=S.settings;let cnt=0,h=0;
 mo.staff.forEach(p=>{if(isSabi(p))return;const st=p.d[d];if(present(st)){cnt++;h+=hrs(st,p)}});
 let users=0;mo.users.forEach(u=>{if(u.u[d]==='通所'||u.u[d]==='在宅')users++});
 const dayH=s.ftWeekH/s.ftDays;const basis=s.dayBasis==='actual'?users:s.baseUsers;
 const reqH=basis/s.ratio*dayH;const lackH=Math.max(0,f1(reqH-h)),lackP=Math.max(0,s.minStaff-cnt);
 return{cnt,h,fte:h/dayH,users,reqH,lackH,lackP,ok:lackH<=0&&lackP<=0}}
function monthStats(mo){
 const s=S.settings;let tot=0;const days=dim(mo);
 mo.staff.forEach(p=>{if(isSabi(p))return;for(let d=1;d<=days;d++)tot+=hrs(p.d[d],p)});
 const ft=s.ftWeekH*days/7,fte=tot/ft;const mk=r=>{const req=s.baseUsers/r;const lack=Math.max(0,f1(req*ft-tot));const wk=f1(lack*7/days);
  return{req,ok:fte>=req,lack,wk,ppl:Math.ceil(wk/(s.h916*s.days916)-1e-9)}};
 let lackDays=0,lackSum=0,open=0;
 for(let d=1;d<=days;d++){if(isClosed(mo,d))continue;open++;const x=dayStats(mo,d);if(!x.ok){lackDays++;lackSum+=x.lackH}}
 const hasFT=mo.staff.some(p=>!isSabi(p)&&defH(p)>=8&&Object.values(p.d).some(present));
 return{tot,ft,fte,a:mk(10),b:mk(7.5),lackDays,lackSum:f1(lackSum),open,hasFT}}
function billing(mo){
 const s=S.settings,days=dim(mo);let rows=[],T={days:0,trips:0,units:0};
 mo.users.forEach(u=>{let tsu=0,zai=0,trips=0;
  for(let d=1;d<=days;d++){if(isClosed(mo,d))continue;const a=u.u[d];if(a==='通所')tsu++;else if(a==='在宅')zai++;else continue;
   if(a==='通所'){const r=u.r[d];if(r==='往復')trips+=2;else if(r==='迎えのみ'||r==='送りのみ')trips+=1}}
  const use=tsu+zai;let units=use*s.baseUnits+trips*s.rideUnits;
  s.adds.forEach(a=>{const q=a.per==='day'?use:a.per==='trip'?trips:1;if(use>0)units+=a.units*q});
  let sho=0,kes=0;
  for(let d=1;d<=days;d++){if(isClosed(mo,d))continue;const a=u.u[d];if(a==='欠席')kes++;
   if((a==='通所'||a==='在宅')&&u.start){const df=Math.round((new Date(mo.y,mo.m-1,d)-new Date(u.start+'T00:00:00'))/86400000);if(df>=0&&df<=29)sho++}}
  kes=Math.min(kes,4);
  CAT.forEach(c=>{const o=s.cat[c.id];if(!o||!o.on)return;const un=o.units??c.u;if(c.per==='kes')units+=un*kes;if(c.per==='sho')units+=un*sho});
  if(use===0&&kes===0){rows.push({name:u.name,tsu,zai,use,trips,units:0,sho:0,kes:0});return}
  CAT.forEach(c=>{const o=s.cat[c.id];if(!o||!o.on||use===0)return;const un=o.units??c.u;
   if(c.per==='day')units+=un*use;else if(c.per==='zai')units+=un*zai;else if(c.per==='count')units+=un*(+(S.counts[mo.y+'-'+mo.m+'|'+u.name+'|'+c.id])||0)});
  rows.push({name:u.name,tsu,zai,use,trips,units,sho,kes});T.days+=use;T.trips+=trips;T.units+=units});
 let once=0;CAT.forEach(c=>{const o=s.cat[c.id];if(o&&o.on&&c.per==='once'&&T.days>0)once+=(o.units??c.u)});T.units+=once;
 const kzr=(s.kaizenFrom&&(mo.y+'-'+String(mo.m).padStart(2,'0'))<s.kaizenFrom)?0:s.kaizen;const kz=T.units*kzr/100;const totalUnits=T.units+kz;
 const total=Math.floor(totalUnits*s.unitPrice);
 // 利用者負担（上限額：設定。0＝負担なし）：10%と上限の小さいほう
 let burden=0;rows.forEach(r=>{const share=Math.floor(r.units*(1+kzr/100)*s.unitPrice);const tenth=Math.floor(share/10);
  const cap=(s.caps[mo.y+'-'+mo.m+'|'+r.name]??s.caps[r.name]??0);r.share=share;r.cap=cap;r.burden=cap===0?0:Math.min(tenth,cap);burden+=r.burden});

async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return null}}
const ub=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return Uint8Array.from(atob(t),c=>c.charCodeAt(0))};
async function verifyLicense(tok){try{tok=(tok||'').trim();const [a,b]=tok.split('.');if(!a||!b)return{ok:false,why:'キーの形が違います'};
 const key=await crypto.subtle.importKey('jwk',PUBJWK,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
 const good=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,ub(b),ub(a));if(!good)return{ok:false,why:'ライセンスキーが正しくありません'};
 const pl=JSON.parse(new TextDecoder().decode(ub(a)));const end=new Date(pl.exp+'T23:59:59');const left=Math.ceil((end-new Date())/86400000);
 if(left<-7)return{ok:false,expired:true,pl,why:'有効期限（'+pl.exp+'）が過ぎています'};
 return{ok:true,pl,left}}catch(e){return{ok:false,why:'ライセンスキーを確認できませんでした'}}}

 const go=async()=>{const id=$('#lid').value.trim(),pw=$('#lpw').value;if(!id||!pw){$('#ler').textContent='IDとパスワードを入れてください';return}
  const v=await sha(SALT+id+'|'+pw);if(v&&ACCTS[id]===v){enter()}else{$('#ler').textContent='IDまたはパスワードが違います'}};
 $('#lbtn').onclick=go;$('#lpw').onkeydown=e=>{if(e.key==='Enter')go()};
 $('#tos').onclick=e=>{e.preventDefault();showDoc('tos')};$('#pp').onclick=e=>{e.preventDefault();showDoc('pp')}}
function showDoc(k){const d=DOCS[k];const w=document.createElement('div');w.style.cssText='position:fixed;inset:0;z-index:99;background:#0007;display:flex;align-items:center;justify-content:center';
 w.innerHTML=`<div class="card" style="max-width:640px;max-height:80vh;overflow:auto;white-space:pre-wrap;line-height:1.7;font-size:13px"><b style="font-size:16px">${d.t}</b>\n\n${d.b}\n\n<button id="dc">閉じる</button></div>`;document.body.appendChild(w);w.querySelector('#dc').onclick=()=>w.remove();w.onclick=e=>{if(e.target===w)w.remove()}}
let popFor=null;
function openPop(td){const kind=td.dataset.kind,opts=kind==='s'?SH:kind==='u'?UO:RO;const r=td.getBoundingClientRect();const p=$('#pop');
 p.innerHTML=opts.map(o=>`<button data-v="${o}">${o||'（空にする）'}</button>`).join('');p.style.display='block';
 p.style.left=Math.min(r.left,innerWidth-140)+'px';p.style.top=Math.min(r.bottom,innerHeight-p.offsetHeight-8)+'px';popFor=td}
document.addEventListener('click',e=>{const t=e.target;const mo=S.months[S.mi];
 if(t.closest('#pop')&&t.dataset.v!==undefined){const td=popFor,i=+td.dataset.i,d=+td.dataset.d,k=td.dataset.kind;
  const tgt=k==='s'?mo.staff[i].d:k==='u'?mo.users[i].u:mo.users[i].r;if(t.dataset.v)tgt[d]=t.dataset.v;else delete tgt[d];$('#pop').style.display='none';ui();return}
 {const pp=$('#pop');if(pp)pp.style.display='none'}
 if(t.classList.contains('cell')){openPop(t);return}
 const gd=t.closest('[data-goday]');if(gd){setTimeout(()=>{const c=document.querySelector('td.cell[data-kind="s"][data-d="'+gd.dataset.goday+'"]');if(c){c.scrollIntoView({inline:'center',block:'center'});c.style.outline='3px solid #96505f'}},10);return}
 if(t.dataset.t){S.tab=t.dataset.t;ui();return}
 if(t.id==='prev'){S.mi=Math.max(0,S.mi-1);ui();return}if(t.id==='next'){if(S.mi>=S.months.length-1){const c=S.months[S.mi];const nm=c.m===12?1:c.m+1,ny=c.m===12?c.y+1:c.y;S.mi=ensureMonth(ny,nm)}else S.mi++;ui();return}
 if(t.dataset.rowfill){const[k,i]=t.dataset.rowfill.split(',');const days=dim(mo);
  if(k==='s'){const p=mo.staff[+i];for(let d=1;d<=days;d++)if(!isClosed(mo,d)&&!p.d[d])p.d[d]=(p.role||'').includes('9-16')?'出勤(9-16)':'出勤';}
  else{const u=mo.users[+i];for(let d=1;d<=days;d++)if(!isClosed(mo,d)&&!u.u[d])u.u[d]='通所'}ui();return}
 if(t.dataset.del){const[k,i]=t.dataset.del.split(',');const nm=(k==='s'?mo.staff:mo.users)[+i].name;if(confirm('「'+nm+'」を、この月（'+mo.m+'月）の初めから外します。以降の月にも出なくなります（過去の月は残ります）。よいですか？')){rosterChange(()=>{const r=S.roster[k==='s'?'staff':'users'].find(x=>x.name===nm);const prevEnd=new Date(mo.y,mo.m-1,0);const e=iso(prevEnd.getFullYear(),prevEnd.getMonth()+1,prevEnd.getDate());if(r.from&&r.from>e){S.roster[k==='s'?'staff':'users'].splice(S.roster[k==='s'?'staff':'users'].indexOf(r),1)}else r.to=e});ui()}return}
 if((t.dataset.add==='u')&&window.LIC&&window.LIC.pl.max&&mo.users.length>=window.LIC.pl.max){alert('ご契約の利用者数の上限（'+window.LIC.pl.max+'人）です。上位のプランに変更すると、追加できます。');return}
 if(t.dataset.add){rosterChange(()=>{if(t.dataset.add==='s')S.roster.staff.push({name:'新しい職員'+(S.roster.staff.length+1),role:'職業指導員（9-16）',h:null,from:monthFirst(mo),to:'',pat:{1:'出勤(9-16)',2:'出勤(9-16)',3:'出勤(9-16)',4:'出勤(9-16)',5:'出勤(9-16)'}});else S.roster.users.push({name:'新しい利用者さん'+(S.roster.users.length+1),group:'',start:'',from:monthFirst(mo),to:'',pat:{},rpat:{}})});ui();return}
 if(t.dataset.radd){rosterChange(()=>{if(t.dataset.radd==='staff')S.roster.staff.push({name:'新しい職員'+(S.roster.staff.length+1),role:'職業指導員（9-16）',h:null,from:monthFirst(mo),to:'',pat:{1:'出勤(9-16)',2:'出勤(9-16)',3:'出勤(9-16)',4:'出勤(9-16)',5:'出勤(9-16)'}});else{if(window.LIC&&window.LIC.pl.max&&S.roster.users.filter(r=>rActive(r,mo)).length>=window.LIC.pl.max){alert('ご契約の利用者数の上限（'+window.LIC.pl.max+'人）です。');return}S.roster.users.push({name:'新しい利用者さん'+(S.roster.users.length+1),group:'',start:'',from:monthFirst(mo),to:'',pat:{},rpat:{}})}});ui();return}
 if(t.dataset.rdel){const [k,i]=t.dataset.rdel.split('|');const r=S.roster[k][+i];if(confirm('「'+r.name+'」を、すべての月から削除します（過去の月の記録も消えます）。辞めた日・利用をやめた日を入れる場合は、削除せず「終了日」を入れてください。よいですか？')){rosterChange(()=>{S.roster[k].splice(+i,1)});ui()}return}
 if(t.id==='aadd'){S.settings.adds.push({name:'新しい加算',units:0,per:'day'});ui();return}
 if(t.dataset.adel){S.settings.adds.splice(+t.dataset.adel,1);ui();return}
 if(t.id==='csv'){const b=billing(mo);const L=['利用者,通所,在宅,利用日数,送迎片道,単位数,金額(10割),負担上限,利用者負担'];b.rows.forEach(r=>L.push([r.name,r.tsu,r.zai,r.use,r.trips,Math.round(r.units),r.share,r.cap,r.burden].join(',')));L.push(['合計','','',b.T.days,b.T.trips,Math.round(b.T.units),b.total,'',b.burden].join(','));
  dl('﻿'+L.join('\n'),`LICO_請求_${mo.y}年${mo.m}月.csv`,'text/csv');return}
 if(t.dataset.applyprice){const r=S.settings.region,l=S.settings.labor;if(r===''||!l){alert('地域区分と人件費割合を入れてください');return}S.settings.unitPrice=Math.round(10*(1+(r/100)*(l/100))*100)/100;ui();return}
 if(t.dataset.reflect){reflectAll(t.dataset.reflect);return}
 if(t.dataset.bulk){t.dataset.bulk==='s918'?openBulk('s',true):openBulk(t.dataset.bulk);return}
 if(t.dataset.copyprev){copyPrev(t.dataset.copyprev);return}
 if(t.id==='csvins'){$('#csvfs').click();return}
 if(t.id==='csvts'){dl(csvTemplateS(),'職員シフト取り込みひな形.csv','text/csv');return}
 if(t.id==='csvin'){$('#csvf').click();return}
 if(t.id==='csvt'){dl(csvTemplate(),'利用日取り込みひな形.csv','text/csv');return}
 if(t.id==='qrb'){$('#qrm').style.display='flex';return}
 if(t.id==='qrc'||t.id==='qrm'){$('#qrm').style.display='none';return}
 if(t.id==='mobt'){document.body.classList.toggle('mob');try{localStorage.setItem('lico_mob',document.body.classList.contains('mob')?'1':'')}catch(e){}return}
 if(t.id==='logout'){sessionStorage.removeItem('lico_in');location.reload();return}
 if(t.dataset.adl){dl(JSON.stringify(S.archive[t.dataset.adl]),'LICO_保管_'+t.dataset.adl+'.json','application/json');return}
 if(t.id==='exp'){dl(JSON.stringify(S),'LICO_シフト管理_バックアップ.json','application/json');return}
 if(t.id==='imp'){$('#file').click();return}
 if(t.id==='reset'){if(confirm('入力したデータをすべて消して、最初の勤務表の状態に戻します。よいですか？')){localStorage.removeItem(KEY);location.reload()}}});
document.addEventListener('change',e=>{const t=e.target,mo=S.months[S.mi];
 if(t.id==='msel'){S.mi=+t.value;ui();return}
 if(t.id==='csvfs'){const r=new FileReader();r.onload=()=>importCsvS(r.result);r.readAsText(t.files[0],'utf-8');t.value='';return}
 if(t.id==='csvf'){const r=new FileReader();r.onload=()=>importCsv(r.result);r.readAsText(t.files[0],'utf-8');t.value='';return}
 if(t.id==='file'){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);S.settings=Object.assign({},DEF,S.settings);ui()}catch(x){alert('読み込めませんでした')}};r.readAsText(t.files[0]);return}

 if(t.dataset.role!==undefined){const nm=mo.staff[+t.dataset.role].name;rosterChange(()=>{S.roster.staff.find(x=>x.name===nm).role=t.value});ui();return}
 if(t.dataset.name!==undefined){const old=mo.staff[+t.dataset.name].name,nw=t.value.trim()||old;rosterChange(()=>{S.roster.staff.find(x=>x.name===old).name=nw;renameAll('staff',old,nw)});ui();return}
 if(t.dataset.grp!==undefined){const nm=mo.users[+t.dataset.grp].name;rosterChange(()=>{S.roster.users.find(x=>x.name===nm).group=t.value});ui();return}
 if(t.dataset.uname!==undefined){const old=mo.users[+t.dataset.uname].name,nw=t.value.trim()||old;rosterChange(()=>{S.roster.users.find(x=>x.name===old).name=nw;renameAll('users',old,nw)});ui();return}
 if(t.dataset.sh!==undefined){const nm=mo.staff[+t.dataset.sh].name,v=parseFloat(t.value);rosterChange(()=>{S.roster.staff.find(x=>x.name===nm).h=isNaN(v)?null:v});ui();return}
 if(t.dataset.ustart!==undefined){const nm=mo.users[+t.dataset.ustart].name;rosterChange(()=>{S.roster.users.find(x=>x.name===nm).start=t.value||''});ui();return}
 if(t.dataset.rs!==undefined){const [k,i,f]=t.dataset.rs.split('|');const r=S.roster[k][+i];const old=r.name;rosterChange(()=>{if(f==='name'){const nw=t.value.trim()||old;r.name=nw;renameAll(k,old,nw)}else if(f==='h'){const v=parseFloat(t.value);r.h=isNaN(v)?null:v}else r[f]=t.value});ui();return}
 if(t.dataset.rp!==undefined){const [k,i,w]=t.dataset.rp.split('|');const r=S.roster[k][+i];rosterChange(()=>{r.pat=r.pat||{};if(t.value)r.pat[+w]=t.value;else delete r.pat[+w]});ui();return}
 if(t.dataset.rr!==undefined){const r=S.roster.users[+t.dataset.rr];rosterChange(()=>{r.rpat={};if(t.value)for(let w=0;w<7;w++)r.rpat[w]=t.value});ui();return}
 if(t.dataset.set){const k=t.dataset.set;S.settings[k]=(k==='dayBasis')?t.value:+t.value;ui();return}
 if(t.dataset.city!==undefined){if(t.value!==''){S.settings.region=+t.value;S.settings.labor=57}ui();return}
 if(t.id==='autoprop'){S.autoProp=t.checked;save();return}
 if(t.dataset.kfrom){S.settings.kaizenFrom=t.value||'';ui();return}
 if(t.dataset.reg){S.settings.region=t.value===''?'':+t.value;ui();return}
 if(t.dataset.con){const c=S.settings.cat[t.dataset.con]=S.settings.cat[t.dataset.con]||{};c.on=t.checked;ui();return}
 if(t.dataset.cun){const c=S.settings.cat[t.dataset.cun]=S.settings.cat[t.dataset.cun]||{};c.units=+t.value||0;ui();return}
 if(t.dataset.cnt){S.counts[t.dataset.cnt]=+t.value||0;ui();return}
 if(t.dataset.cap!==undefined){S.settings.caps[t.dataset.cap]=+t.value||0;ui();return}
 if(t.dataset.an!==undefined){S.settings.adds[+t.dataset.an].name=t.value;ui();return}
 if(t.dataset.au!==undefined){S.settings.adds[+t.dataset.au].units=+t.value||0;ui();return}
 if(t.dataset.ap!==undefined){S.settings.adds[+t.dataset.ap].per=t.value;ui();return}});
function dl(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
(async()=>{
const lk=localStorage.getItem('tp_license');let LIC=null;
if(!sessionStorage.getItem('lico_in')&&lk){const r=await verifyLicense(lk);if(r.ok)sessionStorage.setItem('lico_in','1');else if(r.expired){expiredView(r.why+'。更新したライセンスキーを入れてください');return}}
if(lk){const r=await verifyLicense(lk);if(r.ok)LIC=r;else if(r.expired){sessionStorage.removeItem('lico_in');expiredView(r.why+'。更新したライセンスキーを入れてください');return}}
if(LIC&&LIC.left<=10&&RENEW_URL){try{const r=await fetch(RENEW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:lk})});const j=await r.json();if(j.ok){const v=await verifyLicense(j.key);if(v.ok){localStorage.setItem('tp_license',j.key);LIC=v}}}catch(e){}}
window.LIC=LIC;window.limitOver=()=>{const mo=S.months[S.mi];return LIC&&LIC.pl.max&&mo.users.length>LIC.pl.max};
if(!sessionStorage.getItem('lico_in')){loginView()}else{
initRoster();goToday(true);try{if(localStorage.getItem('lico_mob'))document.body.classList.add('mob')}catch(e){}
if(location.hash){const h=location.hash.slice(1).split(',');S.tab=h[0]==='staffing'?'shift':h[0];if(h[1])S.mi=+h[1];}
ui();
if(LIC&&LIC.left<=7){const b=document.createElement('div');b.style.cssText='background:#fff4d6;border-bottom:1px solid #e6c36a;padding:6px 14px;font-size:13px;text-align:center';b.textContent='ライセンスの期限まであと'+Math.max(0,LIC.left)+'日です（'+LIC.pl.exp+'）。更新のご案内をご確認ください。';document.body.prepend(b)}
setInterval(()=>{const n=new Date(),k=n.getFullYear()+'-'+(n.getMonth()+1);if(S.lastMonth!==k){goToday(true);ui()}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const n=new Date(),k=n.getFullYear()+'-'+(n.getMonth()+1);if(S.lastMonth!==k){goToday(true);ui()}}});
}
})();
